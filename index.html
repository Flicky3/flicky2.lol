<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flicky.lol</title>
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Cinzel:wght@400;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.65);
            --purple-lean: #a855f7;
            --lean-glow: rgba(168, 85, 247, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* R2 Video Background */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -3;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: grayscale(100%) contrast(110%) brightness(50%);
            pointer-events: none;
        }

        .dark-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
            box-shadow: inset 0 0 140px rgba(0,0,0,0.95);
            z-index: -2;
            pointer-events: none;
        }

        /* Rain Canvas Overlay */
        #rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Click to Enter Screen */
        #enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        #enter-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.85;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* Clean Centered Content Container */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 20px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Avatar Container with Lean Cup Badge */
        .avatar-area {
            position: relative;
            margin-bottom: 14px;
        }

        .avatar-wrap {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.1));
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            transition: transform 0.4s ease;
        }

        .avatar-wrap:hover {
            transform: scale(1.06);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            filter: grayscale(100%) contrast(115%);
        }

        /* Lean Cup Badge */
        .lean-cup-badge {
            position: absolute;
            bottom: -2px;
            right: -6px;
            width: 32px;
            height: 32px;
            background: rgba(12, 10, 20, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 14px var(--lean-glow);
            animation: lean-float 3s infinite ease-in-out;
            transition: transform 0.3s;
        }

        .lean-cup-badge:hover {
            transform: scale(1.25) rotate(10deg);
            box-shadow: 0 0 22px rgba(168, 85, 247, 0.85);
        }

        .lean-icon {
            font-size: 1rem;
            filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.8));
        }

        @keyframes lean-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Username & Subtitle */
        .username {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 0 0 25px rgba(255,255,255,0.45);
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.16em;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        /* Location & Views */
        .location-views {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.55);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 14px;
        }

        .location-views span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Bio */
        .bio {
            font-size: 0.92rem;
            font-weight: 300;
            color: rgba(255,255,255,0.85);
            line-height: 1.6;
            margin-bottom: 22px;
            max-width: 380px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
        }

        /* Clean Social Icons */
        .socials-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .social-link {
            color: rgba(255, 255, 255, 0.75);
            font-size: 1.25rem;
            text-decoration: none;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .social-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 6px 20px rgba(255,255,255,0.2);
        }

        /* Clean Floating Music Player (No Heavy Box Border) */
        .music-clean-bar {
            width: 100%;
            max-width: 330px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .music-disc {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.9rem;
            flex-shrink: 0;
            animation: rotate-disc 5s linear infinite;
            animation-play-state: paused;
        }

        .music-disc.playing {
            animation-play-state: running;
        }

        @keyframes rotate-disc {
            100% { transform: rotate(360deg); }
        }

        .track-info {
            display: flex;
            flex-direction: column;
        }

        .track-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .track-artist {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.55);
            font-family: 'JetBrains Mono', monospace;
        }

        .play-toggle {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.05rem;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.85;
        }

        .play-toggle:hover {
            transform: scale(1.18);
            opacity: 1;
        }

        /* Minimal Seek Bar */
        .seek-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .seek-fill {
            height: 100%;
            background: #ffffff;
            border-radius: 3px;
            width: 0%;
            box-shadow: 0 0 10px rgba(255,255,255,0.7);
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Clean Christmas Countdown */
        .clean-xmas-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .xmas-time-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .xmas-tree-anim {
            font-size: 0.95rem;
            animation: bounce-tree 2s infinite ease-in-out;
        }

        @keyframes bounce-tree {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(6deg); }
        }

        .xmas-emojis {
            display: flex;
            gap: 14px;
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 2px;
        }

        .xmas-emojis span {
            animation: float-emoji 2.5s infinite ease-in-out alternate;
        }
        .xmas-emojis span:nth-child(2) { animation-delay: -0.5s; }
        .xmas-emojis span:nth-child(3) { animation-delay: -1s; }
        .xmas-emojis span:nth-child(4) { animation-delay: -1.5s; }

        @keyframes float-emoji {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px) scale(1.1); }
        }

        /* Keyboard hint */
        .keyboard-hint {
            margin-top: 18px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.35);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- R2 Video Background -->
    <video id="bg-video" autoplay loop muted playsinline>

    <!-- Mechanical Keyboard Synthesizer -->
    <script>
        let audioCtx;
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playKeyClank() {
            initAudioContext();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            
            // Switch click
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            const pitchVariation = (Math.random() * 80) - 40;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320 + pitchVariation, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200 + Math.random() * 400, now);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.06);

            // Tactile thock
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(140 + Math.random() * 30, now);
            osc2.frequency.exponentialRampToValueAtTime(45, now + 0.08);

            gain2.gain.setValueAtTime(0.35, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);

            osc2.start(now);
            osc2.stop(now + 0.08);
        }

        window.addEventListener('keydown', () => { playKeyClank(); });

        const overlay = document.getElementById('enter-overlay');
        const playIcon = document.getElementById('play-icon');
        const musicDisc = document.getElementById('music-disc');
        const seekFill = document.getElementById('seek-fill');
        const curTime = document.getElementById('cur-time');
        const totTime = document.getElementById('tot-time');
        const video = document.getElementById('bg-video');
        const audio = document.getElementById('r2-audio');
        const viewDisplay = document.getElementById('view-counter');

        function updateLiveViews() {
            let currentViews = localStorage.getItem('flicky_profile_views');
            if (!currentViews) {
                currentViews = 1337;
            } else {
                currentViews = parseInt(currentViews, 10) + 1;
            }
            localStorage.setItem('flicky_profile_views', currentViews);
            viewDisplay.innerText = Number(currentViews).toLocaleString();
        }

        function updateChristmasCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let xmasDate = new Date(currentYear, 11, 25);

            if (now.getTime() > xmasDate.getTime()) {
                xmasDate = new Date(currentYear + 1, 11, 25);
            }

            const diff = xmasDate.getTime() - now.getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / 1000 / 60) % 60);
            const secs = Math.floor((diff / 1000) % 60);

            document.getElementById('xmas-timer').innerText = 
                `${days}d ${hours}h ${mins}m ${secs}s until Christmas`;
        }
        setInterval(updateChristmasCountdown, 1000);
        updateChristmasCountdown();

        function enterExperience() {
            overlay.classList.add('hidden');
            initAudioContext();
            playKeyClank();
            updateLiveViews();

            video.play().catch(() => {});

            audio.volume = 0.8;
            audio.play().then(() => {
                setPlayState(true);
            }).catch(() => {
                setPlayState(false);
            });
        }

        function toggleAudio(e) {
            e.stopPropagation();
            playKeyClank();
            if (audio.paused) {
                audio.play();
                setPlayState(true);
            } else {
                audio.pause();
                setPlayState(false);
            }
        }

        function setPlayState(playing) {
            if (playing) {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                musicDisc.classList.add('playing');
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                musicDisc.classList.remove('playing');
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            seekFill.style.width = progress + '%';
            curTime.innerText = formatTime(audio.currentTime);
            totTime.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('loadedmetadata', () => {
            totTime.innerText = formatTime(audio.duration);
        });

        function seek(e) {
            playKeyClank();
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = pos * audio.duration;
            }
        }

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function splashLean(e) {
            e.stopPropagation();
            playKeyClank();
            
            const badge = e.currentTarget;
            badge.style.transform = 'scale(1.4) rotate(-15deg)';
            setTimeout(() => { badge.style.transform = ''; }, 300);

            for (let i = 0; i < 8; i++) {
                const drop = document.createElement('div');
                drop.style.position = 'fixed';
                drop.style.left = (e.clientX + (Math.random() * 30 - 15)) + 'px';
                drop.style.top = (e.clientY + (Math.random() * 30 - 15)) + 'px';
                drop.style.width = '8px';
                drop.style.height = '8px';
                drop.style.borderRadius = '50%';
                drop.style.backgroundColor = '#a855f7';
                drop.style.boxShadow = '0 0 10px #c084fc';
                drop.style.pointerEvents = 'none';
                drop.style.zIndex = '999';
                drop.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                document.body.appendChild(drop);

                setTimeout(() => {
                    drop.style.transform = `translate(${(Math.random() * 60 - 30)}px, ${(Math.random() * 60 + 20)}px) scale(0)`;
                    drop.style.opacity = '0';
                }, 20);

                setTimeout(() => { drop.remove(); }, 700);
            }
        }

        // Falling Rain
        const canvas = document.getElementById('rain-canvas');
        const ctx = canvas.getContext('2d');
        let drops = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 140; i++) {
            drops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 25 + 12,
                speed: Math.random() * 12 + 15,
                opacity: Math.random() * 0.45 + 0.2
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1.2;
            ctx.lineCap = 'round';

            for (let drop of drops) {
                ctx.beginPath();
                ctx.globalAlpha = drop.opacity;
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 2, drop.y + drop.length);
                ctx.stroke();

                drop.y += drop.speed;
                drop.x -= 2;

                if (drop.y > canvas.height) {
                    drop.y = -drop.length;
                    drop.x = Math.random() * (canvas.width + 100);
                }
            }
            requestAnimationFrame(drawRain);
        }
        drawRain();
    </script>
</body>
</html>
