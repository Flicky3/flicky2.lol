<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flicky.exe</title>
<!-- Pixelated retro fonts & font icons -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root {
    --text-primary: #ffffff;
    --text-dim: #888888;
    --accent-purple: #a855f7;
    --custom-font: 'Space Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #000;
    font-family: var(--custom-font), monospace;
    color: var(--text-primary);
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    perspective: 1000px;
  }

  /* Click-To-Enter Overlay Screen */
  #enterScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #enterScreen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .enter-prompt {
    font-family: 'Press Start 2P', cursive;
    font-size: 1rem;
    color: #ffffff;
    letter-spacing: 2px;
    animation: blink 1.2s infinite;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Dynamic Background Container */
  .custom-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Video Background Element */
  .custom-bg-video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
    display: none;
    filter: brightness(0.65);
  }

  /* Atmospheric Overlay */
  .bg-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(5, 5, 8, 0.1) 0%, rgba(0, 0, 0, 0.5) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Rain Overlay Canvas */
  #rainCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    width: 100vw;
    height: 100vh;
  }

  /* Main Container */
  .container {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 620px;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transform-style: preserve-3d;
  }

  /* Navigation Tabs */
  .nav-wrap {
    display: flex;
    gap: 8px;
    z-index: 4;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .tab-btn {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #ffffff;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-family: var(--custom-font), monospace;
    font-size: 0.75rem;
    transition: all 0.2s ease;
    backdrop-filter: blur(5px);
  }
  .tab-btn.active, .tab-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: #ffffff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
  }

  /* Tab Views */
  .tab-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .tab-content.hidden {
    display: none;
  }

  /* =========================================================
     TRANSPARENT CARDS WITH 3D TILT MOVEMENT & WHITE BORDER
     ========================================================= */
  .lean-card {
    position: relative;
    background: rgba(255, 255, 255, 0.04) !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
    border-radius: 22px !important;
    isolation: isolate;
    box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45) !important;
    transform-style: preserve-3d;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
  }
  
  .lean-card:hover {
    transform: perspective(800px) rotateX(4deg) rotateY(-4deg) scale(1.02);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.15) !important;
  }

  /* Clean Border Mask Layer */
  .lean-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.95), rgba(255,255,255,0.1));
    background-size: 200% 100%;
    animation: moveBarrier 4s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  @keyframes moveBarrier {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }

  /* Profile Header */
  .profile-card {
    width: 100%;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .profile-header {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  
  .name {
    font-size: 2rem;
    color: #ffffff;
    text-shadow: 0 0 14px rgba(255,255,255,0.9);
  }

  /* Inner Widgets with Clear Background & Animated Borders */
  .widgets-row {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 24px;
    justify-content: center;
  }
  @media(max-width: 520px) { .widgets-row { flex-direction: column; } }

  .mini-widget {
    flex: 1;
    position: relative;
    background: rgba(255, 255, 255, 0.03) !important;
    backdrop-filter: blur(4px);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    isolation: isolate;
    transform-style: preserve-3d;
    transition: transform 0.3s ease;
  }
  .mini-widget:hover {
    transform: perspective(600px) translateZ(10px);
  }

  .mini-widget::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.8), rgba(255,255,255,0.1));
    background-size: 200% 100%;
    animation: moveBarrier 3s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* Profile Picture Thumbnails */
  .pfp-thumb {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd8b8, #a86b4c);
    position: relative;
    flex-shrink: 0;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background-size: cover;
    background-position: center;
  }
  .status-dot {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 10px;
    height: 10px;
    background: #ef4444;
    border: 2px solid #000000;
    border-radius: 50%;
  }

  .widget-info { text-align: left; overflow: hidden; }
  .widget-title { font-weight: 700; font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 8px rgba(0,0,0,0.9); }
  .widget-sub { font-size: 0.68rem; color: #dddddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; text-shadow: 0 0 8px rgba(0,0,0,0.9); }

  /* 3D Spinning Social Icons Grid */
  @keyframes spin3D {
    0% { transform: perspective(600px) rotateY(0deg); }
    100% { transform: perspective(600px) rotateY(360deg); }
  }

  .socials-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 520px;
    margin-top: 8px;
    justify-items: center;
  }

  .social-circle {
    aspect-ratio: 1;
    width: 100%;
    background: transparent !important;
    border: none !important;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    color: #ffffff;
    font-size: 1.2rem;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.9));
    transform-style: preserve-3d;
    animation: spin3D 4s linear infinite;
  }
  .social-circle:hover {
    animation-play-state: paused;
    transform: perspective(600px) scale(1.25) rotateY(0deg);
    filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
  }

  /* Audio Player Card Container */
  .audio-player-bar {
    width: 100%;
    max-width: 520px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .audio-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .song-title {
    font-size: 1.1rem;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
  }
  .audio-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.9rem;
    cursor: pointer;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
  }
  .play-trigger {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #ffffff;
    color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    transition: transform 0.2s ease;
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  .play-trigger:hover { transform: scale(1.15); }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.68rem;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
  }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #ffffff;
    border-radius: 2px;
    position: relative;
    box-shadow: 0 0 8px #ffffff;
  }

  /* Minigames Section */
  .games-card {
    width: 100%;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .game-menu {
    display: flex;
    gap: 10px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }
  .game-btn {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--custom-font), monospace;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .game-btn:hover, .game-btn.active {
    background: rgba(255,255,255,0.3);
    border-color: #fff;
  }
  .game-display {
    width: 100%;
    height: 380px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Flicky Clicker Styles */
  #cookieGame { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 10px; 
    width: 100%;
    height: 100%;
    justify-content: center;
  }
  .cookie-container {
    perspective: 600px;
  }
  .cookie-btn {
    width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #f59e0b, #b45309);
    border: 3px solid #78350f;
    color: #451a03; font-size: 2.2rem; font-weight: bold; cursor: pointer; display: flex;
    align-items: center; justify-content: center; user-select: none;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset -4px -4px 8px rgba(0,0,0,0.4), inset 4px 4px 8px rgba(255,255,255,0.3);
    transform: rotateX(15deg) rotateY(-10deg) translateZ(10px);
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }
  .cookie-btn:active { 
    transform: rotateX(5deg) rotateY(-5deg) translateZ(0px) scale(0.92);
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  }

  .upgrades-container {
    display: flex;
    gap: 8px;
    margin-top: 5px;
  }
  .upgrade-btn {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    padding: 6px 10px;
    color: #fff;
    font-size: 0.65rem;
    cursor: pointer;
    font-family: var(--custom-font), monospace;
    transition: all 0.2s ease;
  }
  .upgrade-btn:hover {
    background: rgba(255,255,255,0.25);
    border-color: #fff;
  }
  .upgrade-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  canvas.game-canvas {
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  footer {
    font-size: 0.65rem;
    color: #bbbbbb;
    letter-spacing: 1px;
    text-transform: lowercase;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

<!-- Dynamic Background Elements -->

  <!-- MINIGAMES TAB -->

<script>
/* =========================================================================
   MEDIA & PLAYER SETUP
   ========================================================================= */
const MEDIA_URL = "https://r2.fivemanage.com/FoPshKR8Y9kaSfVsw1o2b/VideoProject7.mp4";

const bgVideo = document.getElementById('bgVideo');
const enterScreen = document.getElementById('enterScreen');
const playBtn = document.getElementById('playToggle');
const progressFill = document.getElementById('progressFill');
const curTimeText = document.getElementById('curTime');
const totalTimeText = document.getElementById('totalTime');

let isEntered = false;

function enterSite() {
  if (isEntered) return;
  
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  playMechanicalClick();
  isEntered = true;
  enterScreen.classList.add('hidden');
  enterScreen.style.display = 'none';
  
  bgVideo.src = MEDIA_URL;
  bgVideo.style.display = 'block';
  bgVideo.muted = false;
  
  bgVideo.play().then(() => {
    playBtn.textContent = '⏸';
  }).catch((err) => {
    console.warn("Autoplay prevented or restricted:", err);
    playBtn.textContent = '▶';
  });
}

function togglePlay() {
  playMechanicalClick();
  if (bgVideo.paused) {
    bgVideo.play();
    playBtn.textContent = '⏸';
  } else {
    bgVideo.pause();
    playBtn.textContent = '▶';
  }
}

function restartAudio() {
  playMechanicalClick();
  bgVideo.currentTime = 0;
  bgVideo.play();
  playBtn.textContent = '⏸';
}

bgVideo.addEventListener('timeupdate', () => {
  if (!bgVideo.duration) return;
  const pct = (bgVideo.currentTime / bgVideo.duration) * 100;
  progressFill.style.width = pct + '%';
  curTimeText.textContent = formatTime(bgVideo.currentTime);
  totalTimeText.textContent = formatTime(bgVideo.duration);
});

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function seekAudio(e) {
  const bar = e.currentTarget;
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  bgVideo.currentTime = pct * bgVideo.duration;
}

/* ---------------- Tab Switcher ---------------- */
function switchTab(tab, e) {
  playMechanicalClick();
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('profileTab').classList.add('hidden');
  document.getElementById('minigamesTab').classList.add('hidden');

  if (tab === 'profile') {
    document.getElementById('profileTab').classList.remove('hidden');
  } else if (tab === 'minigames') {
    document.getElementById('minigamesTab').classList.remove('hidden');
    loadGame('cookie');
  }

  if (e && e.target) {
    e.target.classList.add('active');
  }
}

/* ---------------- Global Key Listeners ---------------- */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (currentGame === 'flappy' && window.flappyJump) {
      e.preventDefault();
      window.flappyJump();
    } else if (currentGame === 'geometry' && window.geoJump) {
      e.preventDefault();
      window.geoJump();
    }
  }
});

/* ---------------- Minigames Implementation ---------------- */
let currentGame = '';

/* 1. Flicky Clicker */
let cookieCount = 0;
let clickPower = 1;
let autoCps = 0;
let clickCost = 15;
let autoCost = 50;

function clickCookie() {
  playMechanicalClick();
  cookieCount += clickPower;
  updateCookieUI();
}

function buyUpgrade(type) {
  playMechanicalClick();
  if (type === 'click' && cookieCount >= clickCost) {
    cookieCount -= clickCost;
    clickPower += 1;
    clickCost = Math.floor(clickCost * 1.5);
  } else if (type === 'auto' && cookieCount >= autoCost) {
    cookieCount -= autoCost;
    autoCps += 1;
    autoCost = Math.floor(autoCost * 1.6);
  }
  updateCookieUI();
}

function updateCookieUI() {
  const cCountEls = document.querySelectorAll('#cookieCount');
  const cpsCountEls = document.querySelectorAll('#cpsCount');
  const clickCostEls = document.querySelectorAll('#clickCost');
  const autoCostEls = document.querySelectorAll('#autoCost');
  
  cCountEls.forEach(el => el.textContent = Math.floor(cookieCount));
  cpsCountEls.forEach(el => el.textContent = autoCps);
  clickCostEls.forEach(el => el.textContent = clickCost);
  autoCostEls.forEach(el => el.textContent = autoCost);

  document.querySelectorAll('#upgClick').forEach(btn => btn.disabled = cookieCount < clickCost);
  document.querySelectorAll('#upgAuto').forEach(btn => btn.disabled = cookieCount < autoCost);
}

setInterval(() => {
  if (autoCps > 0) {
    cookieCount += autoCps / 10;
    updateCookieUI();
  }
}, 100);

function loadGame(game, e) {
  playMechanicalClick();
  currentGame = game;

  if (e && e.target) {
    document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.game-btn').forEach(b => {
      if(b.textContent.includes(game === 'cookie' ? 'clicker' : (game === 'flappy' ? 'bird' : 'dash'))) {
        b.classList.add('active');
      }
    });
  }

  document.querySelectorAll('#cookieGame').forEach(el => el.style.display = 'none');
  document.querySelectorAll('#flappyCanvas').forEach(el => el.style.display = 'none');
  document.querySelectorAll('#geoCanvas').forEach(el => el.style.display = 'none');

  if (game === 'cookie') {
    document.querySelectorAll('#cookieGame').forEach(el => el.style.display = 'flex');
    updateCookieUI();
  } else if (game === 'flappy') {
    document.querySelectorAll('#flappyCanvas').forEach(el => el.style.display = 'block');
    startFlappy();
  } else if (game === 'geometry') {
    document.querySelectorAll('#geoCanvas').forEach(el => el.style.display = 'block');
    startGeometry();
  }
}

/* 2. Flicky Bird */
let flappyLoop = null;
function startFlappy() {
  if (flappyLoop) cancelAnimationFrame(flappyLoop);
  const canvases = document.querySelectorAll('#flappyCanvas');
  
  canvases.forEach(cvs => {
    const c = cvs.getContext('2d');
    let bird = { x: 50, y: 140, radius: 8 };
    let pipes = [];
    let score = 0;
    let frame = 0;
    let gameOver = false;

    function handleMouseMove(e) {
      if (currentGame !== 'flappy') return;
      const rect = cvs.getBoundingClientRect();
      let mouseY = e.clientY - rect.top;
      bird.y = Math.max(bird.radius, Math.min(cvs.height - bird.radius, mouseY));
    }

    function handleResetClick() {
      if (currentGame !== 'flappy') return;
      if (gameOver) {
        bird.y = 140;
        pipes = [];
        score = 0;
        frame = 0;
        gameOver = false;
        loop();
      }
    }

    cvs.onmousemove = handleMouseMove;
    cvs.onclick = handleResetClick;

    function loop() {
      if (currentGame !== 'flappy') return;
      frame++;

      if (frame > 40 && frame % 100 === 0) {
        let gapHeight = 85;
        let minPipe = 30;
        let maxPipe = cvs.height - gapHeight - minPipe;
        let topH = Math.floor(Math.random() * (maxPipe - minPipe)) + minPipe;
        pipes.push({ x: cvs.width, top: topH, gap: gapHeight, passed: false });
      }

      let skyGrad = c.createLinearGradient(0, 0, 0, cvs.height);
      skyGrad.addColorStop(0, 'rgba(30,41,59,0.5)');
      skyGrad.addColorStop(1, 'rgba(15,23,42,0.5)');
      c.fillStyle = skyGrad;
      c.fillRect(0, 0, cvs.width, cvs.height);

      for (let i = 0; i < pipes.length; i++) {
        let p = pipes[i];
        p.x -= 1.5;

        let pGrad = c.createLinearGradient(p.x, 0, p.x + 30, 0);
        pGrad.addColorStop(0, '#4ade80');
        pGrad.addColorStop(0.7, '#22c55e');
        pGrad.addColorStop(1, '#15803d');

        c.fillStyle = pGrad;
        c.fillRect(p.x, 0, 30, p.top);
        c.fillStyle = '#166534';
        c.fillRect(p.x - 2, p.top - 8, 34, 8);

        let bottomY = p.top + p.gap;
        c.fillStyle = pGrad;
        c.fillRect(p.x, bottomY, 30, cvs.height - bottomY);
        c.fillStyle = '#166534';
        c.fillRect(p.x - 2, bottomY, 34, 8);

        if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 30) {
          if (bird.y - bird.radius < p.top || bird.y + bird.radius > bottomY) {
            gameOver = true;
          }
        }

        if (!p.passed && p.x + 30 < bird.x) {
          p.passed = true;
          score++;
        }
      }

      pipes = pipes.filter(p => p.x > -40);

      let bGrad = c.createRadialGradient(bird.x - 2, bird.y - 2, 1, bird.x, bird.y, bird.radius);
      bGrad.addColorStop(0, '#fef08a');
      bGrad.addColorStop(0.8, '#eab308');
      bGrad.addColorStop(1, '#ca8a04');
      c.fillStyle = bGrad;
      c.beginPath();
      c.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = '#fff';
      c.font = '12px var(--custom-font)';
      c.textAlign = 'left';
      c.fillText('Score: ' + score, 10, 25);

      if (gameOver) {
        c.fillStyle = 'rgba(0,0,0,0.75)';
        c.fillRect(0, 0, cvs.width, cvs.height);
        c.fillStyle = '#fff';
        c.font = '12px var(--custom-font)';
        c.fillText('GAME OVER - Click to Reset', 45, 140);
      } else {
        flappyLoop = requestAnimationFrame(loop);
      }
    }
    loop();
  });
}

/* 3. Flicky Dash */
let geoLoop = null;
function startGeometry() {
  if (geoLoop) cancelAnimationFrame(geoLoop);
  const canvases = document.querySelectorAll('#geoCanvas');

  canvases.forEach(cvs => {
    const c = cvs.getContext('2d');

    let p = { x: 50, y: 170, size: 20, vy: 0, gravity: 0.35, jump: -6.2, grounded: false, rotation: 0 };
    let obstacles = [];
    let frame = 0;
    let gameOver = false;

    function jump() {
      if (currentGame !== 'geometry') return;
      if (gameOver) {
        p.y = 170; p.vy = 0; obstacles = []; frame = 0; gameOver = false; loop();
      } else if (p.grounded) {
        p.vy = p.jump;
        p.grounded = false;
      }
    }

    window.geoJump = jump;
    cvs.onclick = jump;

    function loop() {
      if (currentGame !== 'geometry') return;
      frame++;
      p.vy += p.gravity;
      p.y += p.vy;

      if (p.y >= 170) {
        p.y = 170;
        p.vy = 0;
        p.grounded = true;
        p.rotation = Math.round(p.rotation / 90) * 90;
      } else {
        p.rotation += 4;
      }

      if (frame % 150 === 0) {
        obstacles.push({ x: cvs.width, size: 22 });
      }

      c.fillStyle = 'rgba(9,13,22,0.5)';
      c.fillRect(0, 0, cvs.width, cvs.height);

      c.fillStyle = 'rgba(30,41,59,0.7)';
      c.fillRect(0, 190, cvs.width, 50);
      c.strokeStyle = '#334155';
      c.lineWidth = 1;
      for(let x = (frame * -1.2) % 20; x < cvs.width; x += 20) {
        c.beginPath();
        c.moveTo(x, 190);
        c.lineTo(x - 10, 240);
        c.stroke();
      }

      c.save();
      c.translate(p.x + p.size/2, p.y + p.size/2);
      c.rotate((p.rotation * Math.PI) / 180);
      
      c.fillStyle = '#a855f7';
      c.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      c.strokeStyle = '#f3e8ff';
      c.lineWidth = 2;
      c.strokeRect(-p.size/2, -p.size/2, p.size, p.size);
      c.restore();

      for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.x -= 1.2;

        c.fillStyle = '#991b1b';
        c.beginPath();
        c.moveTo(obs.x + 4, 190);
        c.lineTo(obs.x + obs.size / 2 + 2, 190 - obs.size - 2);
        c.lineTo(obs.x + obs.size + 2, 190);
        c.fill();

        c.fillStyle = '#ef4444';
        c.beginPath();
        c.moveTo(obs.x, 190);
        c.lineTo(obs.x + obs.size / 2, 190 - obs.size);
        c.lineTo(obs.x + obs.size, 190);
        c.closePath();
        c.fill();

        if (p.x + p.size > obs.x + 3 && p.x < obs.x + obs.size - 3 && p.y + p.size > 190 - obs.size + 3) {
          gameOver = true;
        }
      }

      obstacles = obstacles.filter(o => o.x > -30);

      if (gameOver) {
        c.fillStyle = 'rgba(0,0,0,0.7)';
        c.fillRect(0, 0, cvs.width, cvs.height);
        c.fillStyle = '#fff';
        c.font = '13px var(--custom-font)';
        c.textAlign = 'left';
        c.fillText('CRASHED! Click or Space to retry', 70, 120);
      } else {
        geoLoop = requestAnimationFrame(loop);
      }
    }
    loop();
  });
}

/* ---------------- Audio Synthesizers ---------------- */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playMechanicalClick() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const now = audioCtx.currentTime;

  const clickOsc = audioCtx.createOscillator();
  const clickGain = audioCtx.createGain();
  clickOsc.type = 'sine';
  clickOsc.frequency.setValueAtTime(2800, now);
  clickOsc.frequency.exponentialRampToValueAtTime(400, now + 0.015);
  
  clickGain.gain.setValueAtTime(0.4, now);
  clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

  clickOsc.connect(clickGain);
  clickGain.connect(audioCtx.destination);
  clickOsc.start(now);
  clickOsc.stop(now + 0.015);
}

/* ---------------- Rain Background Canvas ---------------- */
const canvas = document.getElementById('rainCanvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

class Drop {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * width;
    this.y = Math.random() * -height;
    this.len = Math.random() * 18 + 10;
    this.speed = Math.random() * 8 + 10;
    this.opacity = Math.random() * 0.3 + 0.1;
  }
  update() {
    this.y += this.speed;
    if (this.y > height) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - 1, this.y + this.len);
    ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

const drops = [];
for (let i = 0; i < 140; i++) drops.push(new Drop());

function animateOverlay() {
  ctx.clearRect(0, 0, width, height);

  for (let drop of drops) {
    drop.update();
    drop.draw();
  }

  requestAnimationFrame(animateOverlay);
}

window.addEventListener('load', () => {
  animateOverlay();
  loadGame('cookie');
});
</script>
